name: Incremental Coverage Check
on:
  push:
  pull_request:

jobs:
  incremental-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm i
      - name: Run tests (produces coverage/lcov.info + coverage-summary.json)
        run: npm test

      - name: 💬 Jest Coverage Comment (with incremental coverage)
        id: coverage
        uses: postman-eng/jest-coverage-comment@feature/incremental-patch-coverage
        with:
          title: unit test code coverage
          coverage-summary-path: coverage/coverage-summary.json
          coverage-lcov-path: coverage/lcov.info
          unique-id-for-comment: unit-test-coverage
          coverage-title: Coverage Breakdown
          report-only-changed-files: true

      - name: 🚦 Gate on incremental (patch) coverage
        if: ${{ always() }}
        env:
          PATCH_COVERAGE: ${{ steps.coverage.outputs.patch-coverage }}
          THRESHOLD: '80'
        run: |
          if [ -z "$PATCH_COVERAGE" ]; then
            echo "::warning::Incremental coverage could not be computed. Not blocking this run."
            exit 0
          fi
          echo "Incremental (patch) coverage: ${PATCH_COVERAGE}% | required: >= ${THRESHOLD}%"
          if awk "BEGIN{exit !(${PATCH_COVERAGE} < ${THRESHOLD})}"; then
            echo "::error::Incremental coverage ${PATCH_COVERAGE}% is below the required ${THRESHOLD}%."
            exit 1
          fi
          echo "Incremental coverage gate passed."
