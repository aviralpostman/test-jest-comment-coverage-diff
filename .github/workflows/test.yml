# .github/workflows/simple-checkout.yml

name: Simple Checkout and Echo

on:
  push:  # triggers on push to any branch

jobs:
  checkout-and-echo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo a message
        run: echo "Hello from GitHub Actions on any branch!"
